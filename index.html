<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>加工时间追踪</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg-light: #f2f2f7;
      --card-light: rgba(255,255,255,0.78);
      --border-light: rgba(0,0,0,0.08);
      --text-light: #1c1c1e;
      --input-light: rgba(255,255,255,0.9);
      --bg-dark: #000000;
      --card-dark: rgba(28,28,30,0.78);
      --border-dark: rgba(255,255,255,0.08);
      --text-dark: #ffffff;
      --input-dark: rgba(44,44,46,0.95);
      --accent: #0a84ff;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "PingFang SC",
        sans-serif;
      background: var(--bg-light);
      color: var(--text-light);
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    body {
      padding:
        max(20px, env(safe-area-inset-top))
        0
        max(20px, env(safe-area-inset-bottom));
    }
    @media (prefers-color-scheme: dark) {
      html,
      body {
        background: var(--bg-dark);
        color: var(--text-dark);
      }
    }
    .container {
      width: 92%;
      max-width: 1000px;
      margin: 20px 0;
      padding: 2rem;
      border-radius: 24px;
      background: var(--card-light);
      border:
        1px solid var(--border-light);
      backdrop-filter:
        blur(30px) saturate(180%);
      -webkit-backdrop-filter:
        blur(30px) saturate(180%);
      box-shadow:
        0 8px 32px rgba(0,0,0,0.08);
    }
    @media (prefers-color-scheme: dark) {
      .container {
        background: var(--card-dark);
        border:
          1px solid var(--border-dark);
        box-shadow:
          0 8px 32px rgba(0,0,0,0.45);
      }
    }
    form {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }
    label {
      display: flex;
      flex-direction: column;
      font-size: 0.92rem;
      font-weight: 500;
    }
    input[type="text"],
    input[type="number"],
    input[type="datetime-local"] {
      width: 100%;
      margin-top: 0.5rem;
      height: 48px;
      min-height: 48px;
      padding: 0 0.9rem;
      border-radius: 14px;
      border:
        1px solid var(--border-light);
      background:
        var(--input-light);
      color:
        var(--text-light);
      font-size: 16px;
      appearance: none;
      -webkit-appearance: none;
    }
    @media (prefers-color-scheme: dark) {
      input[type="text"],
      input[type="number"],
      input[type="datetime-local"] {
        background:
          var(--input-dark);
        border:
          1px solid var(--border-dark);
        color:
          var(--text-dark);
      }
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow:
        0 0 0 3px rgba(10,132,255,0.25);
    }
    input[type="datetime-local"] {
      display: flex;
      align-items: center;
      overflow: hidden;
    }
    input[type="datetime-local"]::-webkit-date-and-time-value {
      min-height: 48px;
      height: 48px;
      display: flex;
      align-items: center;
    }
    input[type="datetime-local"]::-webkit-datetime-edit {
      display: flex;
      align-items: center;
      height: 48px;
    }
    .actions {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      margin-top: 0.5rem;
      width: 100%;
    }
    .actions button {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
    }
    button {
      min-height: 50px;
      border-radius: 14px;
      border: none;
      background:
        rgba(10,132,255,0.12);
      color: inherit;
      font-size: 0.96rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:active {
      transform: scale(0.98);
    }
    @media (max-width: 600px) {
      .container {
        padding: 1.2rem;
      }
      form {
        grid-template-columns: 1fr;
      }
      .actions {
        flex-direction: row;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <form id="procForm">
      <label>
        机台编号
        <input
          type="text"
          id="machine"
          required
        />
      </label>
      <label>
        加工料号
        <input
          type="text"
          id="partNo"
          required
        />
      </label>
      <label>
        加工批号
        <input
          type="text"
          id="batchNo"
          required
        />
      </label>
      <label>
        加工数量
        <input
          type="number"
          id="quantity"
          min="1"
          required
        />
      </label>
      <label>
        正面开始
        <input
          type="datetime-local"
          id="frontStart"
          required
        />
      </label>
      <label>
        正面结束
        <input
          type="datetime-local"
          id="frontEnd"
          required
        />
      </label>
      <label>
        反面开始
        <input
          type="datetime-local"
          id="backStart"
          required
        />
      </label>
      <label>
        反面结束
        <input
          type="datetime-local"
          id="backEnd"
          required
        />
      </label>
      <div class="actions">
        <button
          type="button"
          id="calcBtn"
        >
          添加记录
        </button>
        <button
          type="button"
          id="manageBtn"
        >
          管理记录
        </button>
        <button
          type="button"
          id="exportBtn"
        >
          导出 CSV
        </button>
      </div>
    </form>
  </div>
  <script>
    window.records = [];
    const machineInput =
      document.getElementById('machine');
    function parseDate(val) {
      return new Date(val);
    }
    function formatDuration(ms) {
      const totalMinutes =
        Math.round(ms / 60000);
      const hours =
        Math.floor(totalMinutes / 60);
      const minutes =
        totalMinutes % 60;
      return `${hours}h${minutes}m`;
    }
    function isIOS() {
      return /iPad|iPhone|iPod/.test(
        navigator.userAgent
      ) ||
      (
        navigator.platform === 'MacIntel' &&
        navigator.maxTouchPoints > 1
      );
    }
    // 添加记录
    document
      .getElementById('calcBtn')
      .addEventListener('click', () => {
        const machine =
          machineInput.value.trim();
        const partNo =
          document
            .getElementById('partNo')
            .value
            .trim();
        const batchNo =
          document
            .getElementById('batchNo')
            .value
            .trim();
        const qty =
          Number(
            document
              .getElementById('quantity')
              .value
          );
        if (
          !machine ||
          !partNo ||
          !batchNo ||
          !qty
        ) {
          alert(
            '请填写机台、料号、批号和加工数量'
          );
          return;
        }
        const fSVal =
          document.getElementById('frontStart').value;
        const fEVal =
          document.getElementById('frontEnd').value;
        const bSVal =
          document.getElementById('backStart').value;
        const bEVal =
          document.getElementById('backEnd').value;
        let frontMs = 0;
        let backMs = 0;
        let latestEnd = null;
        if (fSVal && fEVal) {
          const fS = parseDate(fSVal);
          const fE = parseDate(fEVal);
          if (fE <= fS) {
            alert(
              '正面结束时间需晚于开始时间'
            );
            return;
          }
          frontMs = fE - fS;
          latestEnd = fE;
        }
        if (bSVal && bEVal) {
          const bS = parseDate(bSVal);
          const bE = parseDate(bEVal);
          if (bE <= bS) {
            alert(
              '反面结束时间需晚于开始时间'
            );
            return;
          }
          backMs = bE - bS;
          latestEnd =
            latestEnd
            ? new Date(
                Math.max(latestEnd, bE)
              )
            : bE;
        }
        if (!latestEnd) {
          alert(
            '请至少填写一面加工时间'
          );
          return;
        }
        const cycleTimeMs =
          frontMs + backMs;
        const loops =
          Math.ceil(qty / 2);
        const totalTimeMs =
          cycleTimeMs * loops;
        const offTime =
          new Date(
            latestEnd.getTime() +
            totalTimeMs
          );
        window.records.push({
          机台: machine,
          料号: partNo,
          批号: batchNo,
          数量: qty,
          循环次数: loops,
          总时长:
            formatDuration(totalTimeMs),
          下机时间:
            offTime.toLocaleString('zh-CN')
        });
        document
          .getElementById('procForm')
          .reset();
        machineInput.focus();
      });
    // 回车切换输入框
    const inputs =
      Array.from(
        document.querySelectorAll('input')
      );
    inputs.forEach((input, index) => {
      input.addEventListener(
        'keydown',
        (e) => {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          const next =
            inputs[index + 1];
          if (next) {
            next.focus();
          } else {
            document
              .getElementById('calcBtn')
              .click();
          }
        }
      );
    });
    // 导出 CSV
    document
      .getElementById('exportBtn')
      .addEventListener('click', () => {
        if (!window.records.length) {
          alert('无可导出记录');
          return;
        }
        try {
          const headers = [
            '机台',
            '料号',
            '批号',
            '数量',
            '循环次数',
            '总时长',
            '下机时间'
          ];
          const rows =
            window.records.map(r => [
              r['机台'],
              r['料号'],
              r['批号'],
              r['数量'],
              r['循环次数'],
              r['总时长'],
              r['下机时间']
            ]);
          let csv =
            '\uFEFF' +
            headers.join(',') + '\n';
          rows.forEach(row => {
            csv += row
              .map(v =>
                `"${String(v).replace(/"/g, '""')}"`
              )
              .join(',')
              + '\n';
          });
          const blob =
            new Blob(
              [csv],
              {
                type:
                  'text/csv;charset=utf-8;'
              }
            );
          const url =
            URL.createObjectURL(blob);
          // iOS
          if (isIOS()) {
            window.open(
              url,
              '_blank'
            );
            return;
          }
          // 其它浏览器
          const link =
            document.createElement('a');
          link.href = url;
          link.download =
            '加工记录.csv';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setTimeout(() => {
            URL.revokeObjectURL(url);
          }, 1000);
        }
        catch (err) {
          alert(
            '导出失败：' +
            err.message
          );
          console.error(err);
        }
      });
  </script>
</body>
</html>
