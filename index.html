<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>加工时间追踪</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
      font-size: calc(14px + 0.2vw);
      background:
        linear-gradient(
          135deg,
          #ff5f7e 0%,
          #ffba00 30%,
          #34c759 65%,
          #3a5bdb 100%
        ) fixed;
      color: #1c1c1e;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    body {
      padding:
        max(20px, env(safe-area-inset-top))
        0
        max(20px, env(safe-area-inset-bottom));
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      transform: scale(1.5);
      transform-origin: center;
      background-repeat: no-repeat;
      background-size: 110% 110%;
      filter: blur(90px);
      animation:
        bgMove 16s linear infinite alternate;
    }
    @keyframes bgMove {
      0% {
        transform:
          translate(0, 0) scale(1);
      }
      33% {
        transform:
          translate(-25%, 8%) scale(1.05);
      }
      66% {
        transform:
          translate(-50%, -6%) scale(1);
      }
      100% {
        transform:
          translate(-25%, 8%) scale(1.05);
      }
    }
    .container {
      width: 90%;
      max-width: 1000px;
      margin: 20px 0;
      padding: 2rem;
      border-radius: 16px;
      background:
        rgba(255, 255, 255, 0.25);
      backdrop-filter:
        blur(20px) saturate(180%);
      -webkit-backdrop-filter:
        blur(20px) saturate(180%);
      border:
        1px solid rgba(255, 255, 255, 0.4);
      box-shadow:
        0 6px 24px rgba(0, 0, 0, 0.12);
      display: flex;
      align-items: center;
    }
    .card {
      background: transparent;
      box-shadow: none;
      padding: 0;
      width: 100%;
    }
    form {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }
    label {
      display: flex;
      flex-direction: column;
      font-size: 0.9rem;
    }
    input[type="text"],
    input[type="number"],
    input[type="datetime-local"] {
      width: 100%;
      margin-top: 0.5rem;
      height: 48px;
      min-height: 48px;
      padding: 0 0.8rem;
      border:
        1px solid rgba(255, 255, 255, 0.4);
      border-radius: 12px;
      background:
        rgba(255, 255, 255, 0.3);
      backdrop-filter:
        blur(20px) saturate(180%);
      -webkit-backdrop-filter:
        blur(20px) saturate(180%);
      color: #1c1c1e;
      font-size: 16px;
      transition:
        border-color 0.3s,
        background 0.3s;
      appearance: none;
      -webkit-appearance: none;
    }
    input:focus {
      outline: none;
      border-color: #0a84ff;
      background:
        rgba(255, 255, 255, 0.4);
      box-shadow:
        0 0 0 3px rgba(10, 132, 255, 0.3);
    }
    /* iOS datetime 修复 */
    input[type="datetime-local"] {
      display: flex;
      align-items: center;
      overflow: hidden;
    }
    input[type="datetime-local"]::-webkit-date-and-time-value {
      min-height: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      text-align: left;
    }
    input[type="datetime-local"]::-webkit-datetime-edit {
      display: flex;
      align-items: center;
      height: 48px;
      padding: 0;
    }
    input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      opacity: 0.9;
      cursor: pointer;
      margin: 0;
      padding: 0;
    }
    input[type="datetime-local"]::-webkit-inner-spin-button,
    input[type="datetime-local"]::-webkit-clear-button {
      display: none;
    }
    .actions {
      grid-column: 1 / -1;
      display: flex;
      justify-content: center;
      gap: 2rem;
    }
    button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 120px;
      padding: 0.7rem 1.2rem;
      font-size: 0.95rem;
      font-weight: 500;
      border:
        1px solid rgba(255, 255, 255, 0.4);
      border-radius: 12px;
      background:
        rgba(255, 255, 255, 0.2);
      backdrop-filter:
        blur(18px) saturate(160%);
      -webkit-backdrop-filter:
        blur(18px) saturate(160%);
      color: #1c1c1e;
      box-shadow:
        0 6px 20px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      transition: background 0.3s;
      text-align: center;
      white-space: nowrap;
    }
    button:hover {
      background:
        rgba(255, 255, 255, 0.3);
    }
    button:active {
      background:
        rgba(255, 255, 255, 0.4);
    }
    @media (max-width: 600px) {
      .container {
        padding: 1.5rem;
      }
      .actions {
        gap: 1rem;
      }
      button {
        min-width: 0;
        flex: 1;
      }
    }
    @supports (-webkit-touch-callout: none) {
      html,
      body {
        min-height: -webkit-fill-available;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <form id="procForm">
        <label>
          机台编号
          <input
            type="text"
            id="machine"
            required
          />
        </label>
        <label>
          加工料号
          <input
            type="text"
            id="partNo"
            required
          />
        </label>
        <label>
          加工批号
          <input
            type="text"
            id="batchNo"
            required
          />
        </label>
        <label>
          加工数量
          <input
            type="number"
            id="quantity"
            min="1"
            required
          />
        </label>
        <label>
          正面开始
          <input
            type="datetime-local"
            id="frontStart"
            required
          />
        </label>
        <label>
          正面结束
          <input
            type="datetime-local"
            id="frontEnd"
            required
          />
        </label>
        <label>
          反面开始
          <input
            type="datetime-local"
            id="backStart"
            required
          />
        </label>
        <label>
          反面结束
          <input
            type="datetime-local"
            id="backEnd"
            required
          />
        </label>
        <div class="actions">
          <button
            type="button"
            id="calcBtn"
          >
            添加记录
          </button>
          <button
            type="button"
            id="manageBtn"
          >
            管理记录
          </button>
          <button
            type="button"
            id="exportBtn"
          >
            导出 Excel
          </button>
        </div>
      </form>
    </div>
  </div>
  <script src="./lib/xlsx.full.min.js"></script>
  <script>
    window.records = [];
    const machineInput =
      document.getElementById('machine');
    document
      .getElementById('calcBtn')
      .addEventListener('click', () => {
        const machine =
          machineInput.value.trim();
        const partNo =
          document
            .getElementById('partNo')
            .value
            .trim();
        const batchNo =
          document
            .getElementById('batchNo')
            .value
            .trim();
        const qty =
          Number(
            document
              .getElementById('quantity')
              .value
          );
        if (
          !machine ||
          !partNo ||
          !batchNo ||
          !qty
        ) {
          alert(
            '请填写机台、料号、批号和加工数量'
          );
          return;
        }
        const fSVal =
          document.getElementById('frontStart').value;
        const fEVal =
          document.getElementById('frontEnd').value;
        const bSVal =
          document.getElementById('backStart').value;
        const bEVal =
          document.getElementById('backEnd').value;
        let frontMs = 0,
            backMs = 0,
            latestEnd = null;
        if (fSVal && fEVal) {
          const fS = new Date(fSVal),
                fE = new Date(fEVal);
          if (fE <= fS) {
            alert(
              '正面结束时间需晚于开始时间'
            );
            return;
          }
          frontMs = fE - fS;
          latestEnd =
            latestEnd
            ? new Date(Math.max(latestEnd, fE))
            : fE;
        }
        if (bSVal && bEVal) {
          const bS = new Date(bSVal),
                bE = new Date(bEVal);
          if (bE <= bS) {
            alert(
              '反面结束时间需晚于开始时间'
            );
            return;
          }
          backMs = bE - bS;
          latestEnd =
            latestEnd
            ? new Date(Math.max(latestEnd, bE))
            : bE;
        }
        if (!latestEnd) {
          alert(
            '请至少填写一面加工的开始和结束时间'
          );
          return;
        }
        const cycleTimeMs =
          frontMs + backMs;
        const loops =
          Math.ceil(qty / 2);
        const totalTimeMs =
          cycleTimeMs * loops;
        const offTime =
          new Date(
            latestEnd.getTime() + totalTimeMs
          );
        const totalMinutes =
          Math.round(totalTimeMs / 60000);
        const hours =
          Math.floor(totalMinutes / 60);
        const minutes =
          totalMinutes % 60;
        window.records.push({
          机台: machine,
          料号: partNo,
          批号: batchNo,
          数量: qty,
          循环次数: loops,
          总时长:
            `${hours}h${minutes}m`,
          下机时间:
            offTime.toLocaleString(),
        });
        document
          .getElementById('procForm')
          .reset();
        machineInput.focus();
      });
    // 回车自动切换输入框
    const inputs = Array.from(
      document.querySelectorAll('input')
    );
    inputs.forEach((input, index) => {
      input.addEventListener(
        'keydown',
        (e) => {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          const next =
            inputs[index + 1];
          if (next) {
            next.focus();
          } else {
            document
              .getElementById('calcBtn')
              .click();
          }
        }
      );
    });
    document
      .getElementById('manageBtn')
      .addEventListener('click', () => {
        const win =
          window.open(
            '',
            '_blank',
            'width=900,height=600'
          );
        const html = [];
        html.push(`
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>记录管理</title>
<style>
body{
  font-family:Arial,sans-serif;
  padding:1rem;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border:1px solid #ccc;
  padding:0.5rem;
  text-align:center;
}
th{
  background:#f0f0f0;
}
button{
  padding:0.3rem 0.6rem;
  background:#E94E77;
  color:#fff;
  border:none;
  border-radius:4px;
  cursor:pointer;
}
</style>
</head>
<body>
<h2>记录管理</h2>
<table>
<thead>
<tr>
<th>机台</th>
<th>料号</th>
<th>批号</th>
<th>数量</th>
<th>循环次数</th>
<th>总时长</th>
<th>下机时间</th>
<th>操作</th>
</tr>
</thead>
<tbody id="tb"></tbody>
</table>
<script>
const recs = window.opener.records;
function render() {
  const tb =
    document.getElementById("tb");
  tb.innerHTML = "";
  recs.forEach((r, i) => {
    const tr =
      document.createElement("tr");
    Object.values(r).forEach(v => {
      const td =
        document.createElement("td");
      td.textContent = v;
      tr.appendChild(td);
    });
    const btn =
      document.createElement("button");
    btn.textContent = "删除";
    btn.onclick = () => {
      recs.splice(i, 1);
      render();
    };
    const td =
      document.createElement("td");
    td.appendChild(btn);
    tr.appendChild(td);
    tb.appendChild(tr);
  });
}
render();
<\/script>
</body>
</html>
`);
        win.document.write(html.join(''));
        win.document.close();
      });
    document
      .getElementById('exportBtn')
      .addEventListener('click', () => {
        if (!window.records.length) {
          alert('无可导出记录');
          return;
        }
        const wb =
          XLSX.utils.book_new();
        const ws =
          XLSX.utils.json_to_sheet(window.records);
        XLSX.utils.book_append_sheet(
          wb,
          ws,
          '记录'
        );
        XLSX.writeFile(
          wb,
          '加工记录.xlsx'
        );
      });
  </script>
</body>
</html>
