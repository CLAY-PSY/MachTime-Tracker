<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>
<title>加工时间追踪</title>
<style>
:root {
  color-scheme: light dark;
  --bg-light: #f2f2f7;
  --card-light: rgba(255,255,255,0.78);
  --border-light: rgba(0,0,0,0.08);
  --text-light: #1c1c1e;
  --input-light: rgba(255,255,255,0.9);
  --bg-dark: #000000;
  --card-dark: rgba(28,28,30,0.78);
  --border-dark: rgba(255,255,255,0.08);
  --text-dark: #ffffff;
  --input-dark: rgba(44,44,46,0.95);
  --accent: #0a84ff;
}
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
html,
body {
  width: 100%;
  min-height: 100dvh;
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "PingFang SC",
    sans-serif;
  background: var(--bg-light);
  color: var(--text-light);
  display: flex;
  justify-content: center;
  align-items: center;
  padding:
    env(safe-area-inset-top)
    0
    env(safe-area-inset-bottom);
}
@media (prefers-color-scheme: dark) {
  html,
  body {
    background: var(--bg-dark);
    color: var(--text-dark);
  }
}
.container {
  width: 94%;
  max-width: 980px;
  padding: clamp(12px, 1.6vw, 18px);
  border-radius: 18px;
  background: var(--card-light);
  border:
    1px solid var(--border-light);
  backdrop-filter:
    blur(24px) saturate(180%);
  -webkit-backdrop-filter:
    blur(24px) saturate(180%);
  box-shadow:
    0 6px 24px rgba(0,0,0,0.08);
}
@media (prefers-color-scheme: dark) {
  .container {
    background: var(--card-dark);
    border:
      1px solid var(--border-dark);
  }
}
form {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(180px, 1fr));
  gap: 0.75rem;
}
label {
  display: flex;
  flex-direction: column;
  font-size: 0.82rem;
  font-weight: 500;
}
input[type="text"],
input[type="number"],
input[type="datetime-local"] {
  width: 100%;
  margin-top: 0.35rem;
  height: 40px;
  min-height: 40px;
  padding: 0 0.7rem;
  border-radius: 10px;
  border:
    1px solid var(--border-light);
  background:
    var(--input-light);
  color:
    var(--text-light);
  font-size: 15px;
  appearance: none;
  -webkit-appearance: none;
}
@media (prefers-color-scheme: dark) {
  input[type="text"],
  input[type="number"],
  input[type="datetime-local"] {
    background:
      var(--input-dark);
    border:
      1px solid var(--border-dark);
    color:
      var(--text-dark);
  }
}
input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow:
    0 0 0 3px rgba(10,132,255,0.25);
}
input[type="datetime-local"] {
  display: flex;
  align-items: center;
  overflow: hidden;
}
input[type="datetime-local"]::-webkit-date-and-time-value {
  min-height: 40px;
  height: 40px;
  display: flex;
  align-items: center;
}
input[type="datetime-local"]::-webkit-datetime-edit {
  display: flex;
  align-items: center;
  height: 40px;
}
.actions {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: row;
  gap: 0.75rem;
  margin-top: 0.25rem;
}
.actions button {
  flex: 1;
  min-width: 0;
}
button {
  min-height: 42px;
  border-radius: 10px;
  border: none;
  background:
    rgba(10,132,255,0.12);
  color: inherit;
  font-size: 0.86rem;
  font-weight: 600;
  cursor: pointer;
}
button:active {
  transform: scale(0.98);
}
@media (max-width: 768px) {
  .container {
    width: 96%;
    padding: 12px;
  }
  form {
    grid-template-columns:
      repeat(2, 1fr);
    gap: 0.65rem;
  }
  label {
    font-size: 0.78rem;
  }
  input[type="text"],
  input[type="number"],
  input[type="datetime-local"] {
    height: 38px;
    min-height: 38px;
    font-size: 14px;
  }
  button {
    min-height: 40px;
    font-size: 0.82rem;
  }
}
@media (max-width: 520px) {
  body {
    align-items: flex-start;
    padding-top:
      max(8px, env(safe-area-inset-top));
    padding-bottom:
      max(8px, env(safe-area-inset-bottom));
  }
  .container {
    width: 98%;
    padding: 10px;
    border-radius: 14px;
  }
  form {
    grid-template-columns:
      repeat(2, 1fr);
    gap: 0.55rem;
  }
  label {
    font-size: 0.72rem;
  }
  input[type="text"],
  input[type="number"],
  input[type="datetime-local"] {
    height: 36px;
    min-height: 36px;
    padding: 0 0.55rem;
    border-radius: 8px;
    font-size: 13px;
  }
  input[type="datetime-local"]::-webkit-date-and-time-value {
    min-height: 36px;
    height: 36px;
  }
  input[type="datetime-local"]::-webkit-datetime-edit {
    height: 36px;
  }
  .actions {
    gap: 0.5rem;
  }
  button {
    min-height: 36px;
    border-radius: 8px;
    font-size: 0.74rem;
  }
}
</style>
</head>
<body>
<div class="container">
<form id="procForm">
<label>
机台编号
<input type="text" id="machine" required />
</label>
<label>
加工料号
<input type="text" id="partNo" required />
</label>
<label>
加工批号
<input type="text" id="batchNo" required />
</label>
<label>
加工数量
<input type="number" id="quantity" min="1" required />
</label>
<label>
正面开始
<input type="datetime-local" id="frontStart" required />
</label>
<label>
正面结束
<input type="datetime-local" id="frontEnd" required />
</label>
<label>
反面开始
<input type="datetime-local" id="backStart" required />
</label>
<label>
反面结束
<input type="datetime-local" id="backEnd" required />
</label>
<div class="actions">
<button type="button" id="calcBtn">
添加记录
</button>
<button type="button" id="manageBtn">
管理记录
</button>
<button type="button" id="exportBtn">
导出 CSV
</button>
</div>
</form>
</div>
<script>
window.records = [];
const machineInput =
document.getElementById('machine');
function parseDate(val) {
return new Date(val);
}
function formatDuration(ms) {
const totalMinutes =
Math.round(ms / 60000);
const hours =
Math.floor(totalMinutes / 60);
const minutes =
totalMinutes % 60;
return `${hours}h${minutes}m`;
}
function isIOS() {
return /iPad|iPhone|iPod/.test(
navigator.userAgent
) ||
(
navigator.platform === 'MacIntel' &&
navigator.maxTouchPoints > 1
);
}
// 添加记录
document
.getElementById('calcBtn')
.addEventListener('click', () => {
const machine =
machineInput.value.trim();
const partNo =
document
.getElementById('partNo')
.value
.trim();
const batchNo =
document
.getElementById('batchNo')
.value
.trim();
const qty =
Number(
document
.getElementById('quantity')
.value
);
if (
!machine ||
!partNo ||
!batchNo ||
!qty
) {
alert(
'请填写机台、料号、批号和加工数量'
);
return;
}
const fSVal =
document.getElementById('frontStart').value;
const fEVal =
document.getElementById('frontEnd').value;
const bSVal =
document.getElementById('backStart').value;
const bEVal =
document.getElementById('backEnd').value;
let frontMs = 0;
let backMs = 0;
let latestEnd = null;
if (fSVal && fEVal) {
const fS = parseDate(fSVal);
const fE = parseDate(fEVal);
if (fE <= fS) {
alert(
'正面结束时间需晚于开始时间'
);
return;
}
frontMs = fE - fS;
latestEnd = fE;
}
if (bSVal && bEVal) {
const bS = parseDate(bSVal);
const bE = parseDate(bEVal);
if (bE <= bS) {
alert(
'反面结束时间需晚于开始时间'
);
return;
}
backMs = bE - bS;
latestEnd =
latestEnd
? new Date(
Math.max(latestEnd, bE)
)
: bE;
}
if (!latestEnd) {
alert(
'请至少填写一面加工时间'
);
return;
}
const cycleTimeMs =
frontMs + backMs;
const loops =
Math.ceil(qty / 2);
const totalTimeMs =
cycleTimeMs * loops;
const offTime =
new Date(
latestEnd.getTime() +
totalTimeMs
);
window.records.push({
机台: machine,
料号: partNo,
批号: batchNo,
数量: qty,
循环次数: loops,
总时长:
formatDuration(totalTimeMs),
下机时间:
offTime.toLocaleString('zh-CN')
});
document
.getElementById('procForm')
.reset();
machineInput.focus();
});
// 回车切换输入框
const inputs =
Array.from(
document.querySelectorAll('input')
);
inputs.forEach((input, index) => {
input.addEventListener(
'keydown',
(e) => {
if (e.key !== 'Enter') return;
e.preventDefault();
const next =
inputs[index + 1];
if (next) {
next.focus();
} else {
document
.getElementById('calcBtn')
.click();
}
}
);
});
// 管理记录
document
.getElementById('manageBtn')
.addEventListener('click', () => {
const win =
window.open(
'',
'_blank',
'width=900,height=600'
);
if (!win) {
alert('浏览器拦截了弹窗');
return;
}
const html = [];
html.push(`
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>记录管理</title>
<style>
body{
font-family:-apple-system;
padding:1rem;
background:#f2f2f7;
}
table{
width:100%;
border-collapse:collapse;
background:white;
}
th,td{
border:1px solid #ddd;
padding:0.6rem;
text-align:center;
}
th{
background:#f7f7f7;
}
button{
padding:0.4rem 0.8rem;
border:none;
border-radius:8px;
background:#ff3b30;
color:white;
}
</style>
</head>
<body>
<h2>记录管理</h2>
<table>
<thead>
<tr>
<th>机台</th>
<th>料号</th>
<th>批号</th>
<th>数量</th>
<th>循环次数</th>
<th>总时长</th>
<th>下机时间</th>
<th>操作</th>
</tr>
</thead>
<tbody id="tb"></tbody>
</table>
<script>
const recs =
window.opener.records;
function render(){
const tb =
document.getElementById("tb");
tb.innerHTML = "";
recs.forEach((r,i)=>{
const tr =
document.createElement("tr");
Object.values(r).forEach(v=>{
const td =
document.createElement("td");
td.textContent = v;
tr.appendChild(td);
});
const btn =
document.createElement("button");
btn.textContent = "删除";
btn.onclick = ()=>{
recs.splice(i,1);
render();
};
const td =
document.createElement("td");
td.appendChild(btn);
tr.appendChild(td);
tb.appendChild(tr);
});
}
render();
<\/script>
</body>
</html>
`);
win.document.write(
html.join('')
);
win.document.close();
});
// 导出 CSV
document
.getElementById('exportBtn')
.addEventListener('click', () => {
if (!window.records.length) {
alert('无可导出记录');
return;
}
try {
const headers = [
'机台',
'料号',
'批号',
'数量',
'循环次数',
'总时长',
'下机时间'
];
const rows =
window.records.map(r => [
r['机台'],
r['料号'],
r['批号'],
r['数量'],
r['循环次数'],
r['总时长'],
r['下机时间']
]);
let csv =
'\uFEFF' +
headers.join(',') + '\n';
rows.forEach(row => {
csv += row
.map(v =>
`"${String(v).replace(/"/g, '""')}"`
)
.join(',')
+ '\n';
});
const blob =
new Blob(
[csv],
{
type:
'text/csv;charset=utf-8;'
}
);
const url =
URL.createObjectURL(blob);
if (isIOS()) {
window.open(
url,
'_blank'
);
return;
}
const link =
document.createElement('a');
link.href = url;
link.download =
'加工记录.csv';
document.body.appendChild(link);
link.click();
document.body.removeChild(link);
setTimeout(() => {
URL.revokeObjectURL(url);
}, 1000);
}
catch (err) {
alert(
'导出失败：' +
err.message
);
console.error(err);
}
});
</script>
</body>
</html>
